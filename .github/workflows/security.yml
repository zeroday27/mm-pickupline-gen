name: Security
on:
  workflow_call:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false

  sast:
    env:
      # Evaluate the same full-repository policy before and after merge.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e9c4b4b153701845b921f167180044d14fe89b94
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38
        with:
          output: sarif
      - name: Gate high severity findings
        run: |
          jq -ser '
            [.[].runs[] | . as $run | .results[]? as $result
             | ($run.tool.driver, $run.tool.extensions[]?) | .rules[]?
             | select(.id == $result.ruleId)
             | (.properties["security-severity"] // "0" | tonumber) as $score
             | select($score >= 7)
             | $result.locations[0].physicalLocation as $location
             | "\(.id) (\($score)) at \($location.artifactLocation.uri):\($location.region.startLine)"]
            | unique | if length == 0 then "No high-severity findings"
              else (join("\n") + "\n" | halt_error(1)) end' sarif/*.sarif

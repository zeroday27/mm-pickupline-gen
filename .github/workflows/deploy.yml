name: Check and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install wrangler deploy --dry-run
      - name: Test production API image against MongoDB
        run: |
          docker build -f Dockerfile.backend -t pickup-api .
          docker network create pickup-ci
          docker run -d --name mongo --network pickup-ci mongo:8.2
          docker run -d --name api --network pickup-ci -p 127.0.0.1:3000:3000 \
            -e MONGODB_URI=mongodb://mongo:27017/pickup_ci \
            -e ADMIN_USERNAME=ci -e ADMIN_PASSWORD=ci-only pickup-api
          node scripts/smoke.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy Worker, assets and API container
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -eu
          : "${CLOUDFLARE_ACCOUNT_ID:?}" "${CLOUDFLARE_API_TOKEN:?}" "${MONGODB_URI:?}" "${ADMIN_USERNAME:?}" "${ADMIN_PASSWORD:?}" "${APP_URL:?}"
          secret_file=$(mktemp --suffix=.json)
          trap 'rm -f "$secret_file"' EXIT
          node -e 'const keys = ["MONGODB_URI","ADMIN_USERNAME","ADMIN_PASSWORD"]; process.stdout.write(JSON.stringify(Object.fromEntries(keys.map(k => [k, process.env[k]]))))' > "$secret_file"
          npx --no-install wrangler deploy --secrets-file "$secret_file"
      - name: Verify production site and database
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/smoke.mjs --production

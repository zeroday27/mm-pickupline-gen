name: Check and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm audit --prefix backend --audit-level=high
      - run: npm run build
      - run: npx --no-install wrangler deploy --dry-run --containers-rollout none
      - name: Test production API image against MongoDB
        run: |
          docker build -f Dockerfile.backend -t pickup-api .
          docker network create pickup-ci
          docker run -d --name mongo --network pickup-ci mongo:8.2
          docker run -d --name api --network pickup-ci -p 127.0.0.1:3000:3000 \
            -e MONGODB_URI=mongodb://mongo:27017/pickup_ci \
            -e ADMIN_USERNAME=ci -e ADMIN_PASSWORD=ci-only pickup-api
          node scripts/smoke.mjs

      - name: Scan the API image
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: pickup-api
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate CycloneDX inventory
        uses: anchore/sbom-action@73fc65f9f613b4bb1305b6957eddd1217aa991ff
        with:
          format: cyclonedx-json
          artifact-name: pickup.cdx.json
          output-file: pickup.cdx.json

  deploy:
    needs: [check, security]
    if: vars.ENABLE_PRODUCTION_DEPLOY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Load deployment secrets
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: /pickup
          include-imports: false
      - name: Deploy Worker, assets and API container
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -eu
          : "${CLOUDFLARE_ACCOUNT_ID:?}" "${CLOUDFLARE_API_TOKEN:?}" "${MONGODB_URI:?}" "${ADMIN_USERNAME:?}" "${ADMIN_PASSWORD:?}" "${APP_URL:?}"
          secret_file=$(mktemp --suffix=.json)
          trap 'rm -f "$secret_file"' EXIT
          node -e 'const keys = ["MONGODB_URI","ADMIN_USERNAME","ADMIN_PASSWORD"]; process.stdout.write(JSON.stringify(Object.fromEntries(keys.map(k => [k, process.env[k]]))))' > "$secret_file"
          npx --no-install wrangler deploy --secrets-file "$secret_file"
      - name: Verify production site and database
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/smoke.mjs --production

name: Check and deploy
on:
  pull_request:
  push:
    branches: [dev, stag, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint GitHub workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d -color .github/workflows/*.yml
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm audit --prefix backend --audit-level=high
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npx --no-install wrangler deploy --dry-run --containers-rollout none
      - name: Test production API image against MongoDB
        run: |
          docker build -f Dockerfile.backend -t pickup-api .
          docker network create pickup-ci
          docker run -d --name mongo --network pickup-ci mongo:8.2
          docker run -d --name api --network pickup-ci -p 127.0.0.1:3000:3000 \
            -e MONGODB_URI=mongodb://mongo:27017/pickup_ci \
            -e ADMIN_USERNAME=ci -e ADMIN_PASSWORD=ci-only pickup-api
          node scripts/smoke.mjs

      - name: Test the combined staging image
        run: |
          docker build --target cloud_run -f Dockerfile.backend -t pickup-staging .
          docker run -d --name stage --network pickup-ci -p 127.0.0.1:3001:3000 \
            -e MONGODB_URI=mongodb://mongo:27017/pickup_ci \
            -e ADMIN_USERNAME=ci -e ADMIN_PASSWORD=ci-only pickup-staging
          APP_URL=http://127.0.0.1:3001 node scripts/smoke.mjs --production
          curl --fail --silent http://127.0.0.1:3001/admin | grep -q 'id="root"'

      - name: Scan the API image
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: pickup-api
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate CycloneDX inventory
        uses: anchore/sbom-action@73fc65f9f613b4bb1305b6957eddd1217aa991ff
        with:
          format: cyclonedx-json
          artifact-name: pickup.cdx.json
          output-file: pickup.cdx.json

  dependency-track:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPENDENCY_TRACK_URL != ''
    needs: [security, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: pickup.cdx.json
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: /pickup-inventory
          secret-name: DEPENDENCY_TRACK_API_KEY
          include-imports: false
      - name: Submit release inventory
        env:
          TRACK_URL: ${{ vars.DEPENDENCY_TRACK_URL }}
          PROJECT: ${{ vars.DEPENDENCY_TRACK_PROJECT_UUID }}
        run: |
          curl --proto '=https' --fail-with-body --silent --show-error \
            -H "X-Api-Key: ${DEPENDENCY_TRACK_API_KEY:?}" -F "project=${PROJECT:?}" \
            -F 'bom=@pickup.cdx.json' "${TRACK_URL%/}/api/v1/bom"

  live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pickup-cloud-run-live
      cancel-in-progress: false
    env:
      IMAGE: asia-southeast1-docker.pkg.dev/yangonai/pickup-staging/app
      APP_URL: https://pickupline-mm.yangonai.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build release image
        run: docker build --target cloud_run -f Dockerfile.backend -t "$IMAGE:$GITHUB_SHA" .
      - name: Scan release image
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Authenticate release deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/1023191960735/locations/global/workloadIdentityPools/pickup-staging/providers/github
          service_account: pickup-staging-deploy@yangonai.iam.gserviceaccount.com
      - name: Publish release image
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Fetch MONGODB_URI
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          oidc-audience: infisical-mm-pickupline-gen-staging
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: staging
          secret-path: /pickup
          secret-name: MONGODB_URI
          include-imports: false
      - name: Fetch ADMIN_USERNAME
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          oidc-audience: infisical-mm-pickupline-gen-staging
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: staging
          secret-path: /pickup
          secret-name: ADMIN_USERNAME
          include-imports: false
      - name: Fetch ADMIN_PASSWORD
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          oidc-audience: infisical-mm-pickupline-gen-staging
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: staging
          secret-path: /pickup
          secret-name: ADMIN_PASSWORD
          include-imports: false

      - name: Deploy live revision
        shell: bash
        run: |
          set -euo pipefail
          : "${MONGODB_URI:?}" "${ADMIN_USERNAME:?}" "${ADMIN_PASSWORD:?}"
          bindings=()
          for key in MONGODB_URI ADMIN_USERNAME ADMIN_PASSWORD; do
            name="pickup-staging-${key,,}"
            name="${name//_/-}"
            version=$(printf '%s' "${!key}" | gcloud secrets versions add "$name" \
              --project=yangonai --data-file=- --format='value(name)')
            version=${version##*/}
            [[ "$version" =~ ^[0-9]+$ ]]
            bindings+=("$key=$name:$version")
          done
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          gcloud run services update pickup-staging --project=yangonai --region=asia-southeast1 \
            --startup-probe=httpGet.path=/api/health,httpGet.port=8080,periodSeconds=5,timeoutSeconds=3,failureThreshold=18 \
            --update-env-vars=CORS_ORIGINS=https://pickupline-mm.yangonai.com \
            --image="$digest" --set-secrets="$(IFS=,; echo "${bindings[*]}")" --quiet
      - name: Verify public UI, generator and admin authentication
        run: node scripts/smoke-cloud-run.mjs
